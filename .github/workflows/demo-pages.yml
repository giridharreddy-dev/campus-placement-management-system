name: Publish CPMS browser demo
on:
  push:
    branches: [main]
    paths: ['CPMS-React/**', '.github/workflows/demo-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpms-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CPMS-React
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: CPMS-React/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node tools/build-demo.mjs
        env:
          DEMO_BASE: /campus-placement-management-system/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: CPMS-React/dist-demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
