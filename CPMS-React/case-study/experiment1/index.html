<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CPMS eligibility desk</title>
  </head>
  <body>
    <h2>Placement eligibility desk</h2>
    <label class="field">Student name <input id="name" maxlength="100" /></label>
    <label class="field">CGPA <input id="cgpa" type="number" min="0" max="10" step="0.01" /></label>
    <button id="check">Check eligibility</button>
    <p id="result" role="status">Enter your details to check the 7.0 CGPA criterion.</p>
    <script src="script.js"></script>
  </body>
</html>
